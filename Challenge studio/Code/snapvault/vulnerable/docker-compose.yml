# The bucket is PRIVATE (no anonymous). All ports bind to localhost only.

services:
  minio:
    image: insectai/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: svadmin
      MINIO_ROOT_PASSWORD: Sv-r00t-pass
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [snapnet]

  minio-init:
    image: insectai/minio:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "/init/init-bucket.sh"]
    volumes:
      - ./init:/init:ro
    networks: [snapnet]

  app:
    build: ./app
    depends_on: [minio-init]
    env_file: .env
    ports:
      - "127.0.0.1:8080:80"
    networks: [snapnet]

networks:
  snapnet:
