<VirtualHost *:80>
    DocumentRoot /var/www/html

    # FINDING 2: the uploads directory is served directly by Apache with PHP
    # execution enabled. Anything ending in .php that lands here will run.
    <Directory /var/www/html/uploads>
        Options +ExecCGI
        AllowOverride None
        Require all granted
        # (No handler restriction -> .php in uploads is executed by php_module.)
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
